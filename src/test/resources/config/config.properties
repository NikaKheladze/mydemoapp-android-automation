# ---------------------------------------------------------------------------
# Default (committed) configuration.
#
# Every key can be overridden, highest priority first, by:
#   1. JVM / Maven system property:   mvn test -Ddevice.name=Pixel_8
#   2. Environment variable:          DEVICE_NAME=Pixel_8   (dots -> underscores, upper case)
#   3. config/config.local.properties (git-ignored; copy config.local.properties.example)
#
# An empty value means "not set". Never put machine-specific absolute paths here.
# ---------------------------------------------------------------------------

# Appium server
appium.server.url=http://127.0.0.1:4723

# Device / platform
platform.name=Android
automation.name=UiAutomator2
device.name=Android Emulator
# Optional: pin an Android version (e.g. 15) or a specific device serial from `adb devices`
platform.version=
udid=

# Application under test.
# app.path is resolved relative to the project root. Leave it empty to launch an already-installed app.
app.path=apps/mda-2.3.0-27.apk
app.package=com.saucelabs.mydemoapp.android
app.activity=com.saucelabs.mydemoapp.android.view.activities.SplashActivity
app.wait.activity=com.saucelabs.mydemoapp.android.view.activities.*

# Timeouts (seconds)
explicit.wait.timeout.seconds=15
new.command.timeout.seconds=120
server.install.timeout.seconds=120
