# Compiles the framework on every push/PR. Test execution needs an Android device
# and an Appium server, so it is intentionally not part of this workflow.
name: build

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile main and test sources
        run: ./mvnw -B -ntp test-compile
